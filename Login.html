<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Skillora | Connexion</title>

    <style>

        /* =========================================
           VARIABLES
        ========================================= */

        :root {
            --dark: #05051A;
            --dark-light: #0D0D29;
            --gold: #FFB12E;
            --gold-hover: #FFD477;
            --white: #FFFFFF;
            --text: #151526;
            --text-soft: #6B6B7B;
            --border: #E5E5EC;
            --error: #D92D20;
            --success: #16A34A;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    var(--dark),
                    var(--dark-light)
                );

            overflow-x: hidden;
        }


        /* =========================================
           PAGE
        ========================================= */

        .login-container {
            width: 100%;
            max-width: 420px;
        }


        /* =========================================
           CARTE
        ========================================= */

        .login-card {
            width: 100%;

            background: var(--white);

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.35);

            border:
                1px solid
                rgba(255, 177, 46, 0.20);
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-section {
            text-align: center;

            margin-bottom: 32px;
        }


        .brand {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 18px;
        }


        .logo-mark {
            width: 42px;
            height: 42px;

            border:
                4px solid
                var(--gold);

            border-left-color: transparent;
            border-bottom-color: transparent;

            border-radius: 5px;

            transform: rotate(45deg);
        }


        .brand-name {
            font-size: 28px;

            font-weight: 800;

            letter-spacing: 2px;

            color: var(--dark);
        }


        .brand-name span {
            color: var(--gold);
        }


        .logo-section h1 {
            font-size: 25px;

            color: var(--text);

            margin-bottom: 8px;
        }


        .logo-section p {
            color: var(--text-soft);

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================================
           FORMULAIRE
        ========================================= */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            color: var(--text);

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper input {
            width: 100%;

            height: 54px;

            padding:
                0 48px 0 16px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            color: var(--text);

            background: #FFFFFF;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        .input-wrapper input:focus {
            border-color:
                var(--gold);

            box-shadow:
                0 0 0 4px
                rgba(255, 177, 46, 0.15);
        }


        .input-wrapper input::placeholder {
            color: #A0A0AF;
        }


        /* =========================================
           BOUTON AFFICHER MOT DE PASSE
        ========================================= */

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: #777788;

            font-size: 16px;

            cursor: pointer;

            border-radius: 8px;
        }


        .toggle-password:hover {
            background:
                rgba(0, 0, 0, 0.05);
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            display: none;

            padding: 12px 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.4;
        }


        .message.show {
            display: block;
        }


        .message.error {
            color: var(--error);

            background:
                rgba(217, 45, 32, 0.08);

            border:
                1px solid
                rgba(217, 45, 32, 0.15);
        }


        .message.success {
            color: var(--success);

            background:
                rgba(22, 163, 74, 0.08);

            border:
                1px solid
                rgba(22, 163, 74, 0.15);
        }


        /* =========================================
           BOUTON CONNEXION
        ========================================= */

        .login-button {
            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 12px;

            background:
                var(--gold);

            color:
                var(--dark);

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;

            margin-top: 5px;
        }


        .login-button:hover {
            background:
                var(--gold-hover);

            transform:
                translateY(-2px);
        }


        .login-button:active {
            transform:
                translateY(0);
        }


        .login-button:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .login-footer {
            text-align: center;

            margin-top: 22px;

            color: #777788;

            font-size: 12px;
        }


        /* =========================================
           RESPONSIVE MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }


            .login-card {
                padding:
                    30px 20px;

                border-radius:
                    20px;
            }


            .brand-name {
                font-size: 24px;
            }


            .logo-section h1 {
                font-size: 22px;
            }


            .logo-section p {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <main class="login-card">


        <!-- LOGO -->

        <div class="logo-section">

            <div class="brand">

                <div class="logo-mark"></div>

                <div class="brand-name">
                    SKILL<span>ORA</span>
                </div>

            </div>


            <h1>
                Connexion
            </h1>


            <p>
                Entrez vos identifiants pour accéder
                à votre formation.
            </p>

        </div>


        <!-- MESSAGE ERREUR -->

        <div
            id="errorMessage"
            class="message error"
        >
            Identifiant ou mot de passe incorrect.
        </div>


        <!-- MESSAGE SUCCÈS -->

        <div
            id="successMessage"
            class="message success"
        >
            Connexion réussie. Redirection...
        </div>


        <!-- FORMULAIRE -->

        <form
            id="loginForm"
            autocomplete="off"
        >


            <!-- IDENTIFIANT -->

            <div class="form-group">

                <label for="loginInput">
                    Identifiant
                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="loginInput"
                        placeholder="Votre identifiant"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- MOT DE PASSE -->

            <div class="form-group">

                <label for="passwordInput">
                    Mot de passe
                </label>


                <div class="input-wrapper">

                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Afficher le mot de passe"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- BOUTON -->

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Se connecter
            </button>


        </form>


        <div class="login-footer">
            © 2026 Skillora Digital Learning
        </div>


    </main>


</div>


<script>

    "use strict";


    /* =========================================
       ÉLÉMENTS
    ========================================= */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginInput =
        document.getElementById(
            "loginInput"
        );


    const passwordInput =
        document.getElementById(
            "passwordInput"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const successMessage =
        document.getElementById(
            "successMessage"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    /* =========================================
       COMPTES SKILLORA
    ========================================= */

    const users = [

        {
            login: "creation",
            password: "2214",
            redirect:
                "https://classroom.google.com/c/ODc0OTU3MzQ4ODA4?cjc=kbvzymu3"
        },


        {
            login: "SkilloraAI006",
            password: "JkL28",
            redirect:
                "https://classroom.google.com/c/ODc0OTU3Nzg2NTAx?cjc=r33njxi4"
        },


        {
            login: "bureauPro",
            password: "123",
            redirect:
                "bureautique.html"
        },


        {
            login: "admin",
            password: "admin123",
            redirect:
                "admin.html"
        },


        {
            login: "devWeb",
            password: "DevWeb123",
            redirect:
                "https://classroom.google.com/c/ODc0OTUxOTQ3MTAw?cjc=n3jznwpf"
        }

    ];


    /* =========================================
       AFFICHER / MASQUER MOT DE PASSE
    ========================================= */

    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type ===
                "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            togglePassword.textContent =
                isPassword
                    ? "🙈"
                    : "👁";

        }
    );


    /* =========================================
       CACHER LES MESSAGES
    ========================================= */

    function hideMessages() {

        errorMessage.classList.remove(
            "show"
        );


        successMessage.classList.remove(
            "show"
        );

    }


    loginInput.addEventListener(
        "input",
        hideMessages
    );


    passwordInput.addEventListener(
        "input",
        hideMessages
    );


    /* =========================================
       CONNEXION
    ========================================= */

    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const login =
                loginInput.value.trim();


            const password =
                passwordInput.value;


            const user =
                users.find(
                    function (item) {

                        return (
                            item.login === login &&
                            item.password === password
                        );

                    }
                );


            /* CONNEXION RÉUSSIE */

            if (user) {

                errorMessage.classList.remove(
                    "show"
                );


                successMessage.textContent =
                    "Connexion réussie. Redirection...";


                successMessage.classList.add(
                    "show"
                );


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Connexion...";


                setTimeout(
                    function () {

                        window.location.href =
                            user.redirect;

                    },
                    700
                );

            }


            /* CONNEXION INCORRECTE */

            else {

                successMessage.classList.remove(
                    "show"
                );


                errorMessage.textContent =
                    "Identifiant ou mot de passe incorrect.";


                errorMessage.classList.add(
                    "show"
                );


                passwordInput.value = "";


                passwordInput.focus();

            }

        }
    );

</script>


</body>

</html>
