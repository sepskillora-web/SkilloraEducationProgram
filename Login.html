```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Skillora · Connexion</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />

  <style>
    :root {
      --skillora-dark: #040419;
      --skillora-medium: #10102E;
      --skillora-accent: #FBB03B;
      --skillora-accent-hover: #E39A25;
      --skillora-white: #FFFFFF;
    }

    body {
      background:
        linear-gradient(
          145deg,
          var(--skillora-dark) 0%,
          var(--skillora-medium) 100%
        );

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        'Inter',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      margin: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.97);

      backdrop-filter: blur(6px);

      border-radius: 2.5rem;

      box-shadow:
        0 30px 50px -20px rgba(0, 0, 0, 0.65);

      border:
        1px solid rgba(251, 176, 59, 0.25);

      transition: all 0.2s;

      width: 100%;

      max-width: 420px;
    }

    .login-card:hover {
      border-color:
        rgba(251, 176, 59, 0.55);
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;

      left: 16px;

      top: 50%;

      transform: translateY(-50%);

      color: var(--skillora-dark);

      opacity: 0.6;

      transition: all 0.2s;

      z-index: 2;
    }

    .input-group input {
      width: 100%;

      padding:
        0.9rem
        1rem
        0.9rem
        3rem;

      border:
        2px solid #e2e8f0;

      border-radius: 1.25rem;

      font-size: 1rem;

      background: white;

      transition: all 0.2s;

      outline: none;

      box-sizing: border-box;
    }

    .input-group input:focus {
      border-color:
        var(--skillora-accent);

      box-shadow:
        0 0 0 4px
        rgba(251, 176, 59, 0.20);
    }

    .input-group input:focus + i {
      color:
        var(--skillora-accent);

      opacity: 1;
    }

    .btn-login {
      background:
        var(--skillora-accent);

      color: white;

      font-weight: 700;

      padding:
        0.9rem
        1.5rem;

      border-radius: 1.5rem;

      border: none;

      width: 100%;

      font-size: 1.1rem;

      transition: all 0.25s;

      cursor: pointer;

      box-shadow:
        0 8px 18px
        rgba(251, 176, 59, 0.35);

      letter-spacing: 0.5px;
    }

    .btn-login:hover {
      background:
        var(--skillora-accent-hover);

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 24px
        rgba(251, 176, 59, 0.45);
    }

    .btn-login:active {
      transform:
        scale(0.97);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-password {
      position: absolute;

      right: 16px;

      top: 50%;

      transform:
        translateY(-50%);

      background: transparent;

      border: none;

      color: #64748b;

      cursor: pointer;

      font-size: 1.1rem;

      padding:
        4px 6px;

      border-radius: 30px;

      transition: all 0.15s;

      z-index: 5;
    }

    .toggle-password:hover {
      color:
        var(--skillora-dark);

      background:
        rgba(4, 4, 25, 0.06);
    }

    .error-msg {
      color: #dc2626;

      font-size: 0.9rem;

      margin-top: 0.5rem;

      display: flex;

      align-items: center;

      gap: 0.4rem;

      opacity: 0;

      transition: opacity 0.3s;

      min-height: 1.8rem;
    }

    .error-msg.show {
      opacity: 1;
    }

    .success-msg {
      color: #16a34a;

      font-size: 0.9rem;

      margin-top: 0.5rem;

      display: flex;

      align-items: center;

      gap: 0.4rem;

      opacity: 0;

      transition: opacity 0.3s;

      min-height: 1.8rem;
    }

    .success-msg.show {
      opacity: 1;
    }

    .logo-skillora {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin-bottom: 10px;
    }

    .logo-skillora img {
      width: 58px;

      height: 58px;

      object-fit: cover;

      border-radius: 10px;

      display: block;
    }

    .footer-text {
      color: #64748b;

      font-size: 0.85rem;
    }

    .footer-text a {
      color:
        var(--skillora-accent);

      font-weight: 600;

      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .user-badge {
      display: inline-block;

      padding:
        2px 10px;

      border-radius: 20px;

      font-size: 0.7rem;

      font-weight: 600;

      margin:
        0 2px;
    }

    .badge-dev {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-ia {
      background: #f3e8ff;
      color: #6b21a5;
    }

    .badge-bureau {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-admin {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-creation {
      background: #fce7f3;
      color: #9d174d;
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-10px);
      }

      75% {
        transform: translateX(10px);
      }
    }

    @media (max-width: 480px) {
      body {
        padding:
          20px;
      }

      .login-card {
        border-radius:
          2rem;

        max-width:
          100%;
      }

      .logo-skillora img {
        width: 52px;

        height: 52px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       CARTE DE CONNEXION
       ========================================================= -->

  <div class="login-card p-8 md:p-10 mx-4">

    <!-- =======================================================
         LOGO + TITRE
         ======================================================= -->

    <div class="flex flex-col items-center text-center mb-6">

      <div class="logo-skillora">

        <img
          src="logo/logo.png"
          alt="Logo Skillora"
        />

        <span
          class="text-3xl font-bold"
          style="color: #040419;"
        >
          Skillora<span
            style="color: #FBB03B;"
          >.</span>
        </span>

      </div>

      <h2
        class="text-xl font-semibold"
        style="color: #040419;"
      >
        Connexion
      </h2>

      <p class="text-sm text-gray-500">
        Entrez vos identifiants pour accéder
      </p>

    </div>


    <!-- =======================================================
         FORMULAIRE
         ======================================================= -->

    <form
      id="loginForm"
      class="space-y-5"
      autocomplete="off"
    >

      <!-- IDENTIFIANT -->

      <div class="input-group">

        <i class="fas fa-user"></i>

        <input
          type="text"
          id="loginInput"
          placeholder="Identifiant"
          required
          autocomplete="username"
          class="pl-12"
        />

      </div>


      <!-- MOT DE PASSE -->

      <div class="input-group">

        <i class="fas fa-lock"></i>

        <input
          type="password"
          id="passwordInput"
          placeholder="Mot de passe"
          required
          autocomplete="current-password"
          class="pl-12 pr-12"
        />

        <button
          type="button"
          id="togglePasswordBtn"
          class="toggle-password"
          aria-label="Afficher ou masquer le mot de passe"
        >
          <i
            class="fas fa-eye"
            id="eyeIcon"
          ></i>
        </button>

      </div>


      <!-- MESSAGE ERREUR -->

      <div
        id="errorMessage"
        class="error-msg"
      >

        <i class="fas fa-circle-exclamation"></i>

        <span id="errorText">
          Identifiant ou mot de passe incorrect.
        </span>

      </div>


      <!-- MESSAGE SUCCÈS -->

      <div
        id="successMessage"
        class="success-msg"
      >

        <i class="fas fa-check-circle"></i>

        <span id="successText">
          Connexion réussie ! Redirection...
        </span>

      </div>


      <!-- BOUTON -->

      <button
        type="submit"
        class="btn-login"
        id="loginButton"
      >

        <i
          class="fas fa-arrow-right-to-bracket mr-2"
        ></i>

        Se connecter

      </button>

    </form>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    (function () {

      "use strict";


      /* =======================================================
         ÉLÉMENTS DOM
         ======================================================= */

      const loginForm =
        document.getElementById("loginForm");

      const loginInput =
        document.getElementById("loginInput");

      const passwordInput =
        document.getElementById("passwordInput");

      const errorMsg =
        document.getElementById("errorMessage");

      const errorText =
        document.getElementById("errorText");

      const successMsg =
        document.getElementById("successMessage");

      const successText =
        document.getElementById("successText");

      const toggleBtn =
        document.getElementById("togglePasswordBtn");

      const eyeIcon =
        document.getElementById("eyeIcon");

      const loginButton =
        document.getElementById("loginButton");


      /* =======================================================
         AFFICHER / MASQUER LE MOT DE PASSE
         ======================================================= */

      let passwordVisible = false;

      toggleBtn.addEventListener(
        "click",
        function (e) {

          e.preventDefault();

          passwordVisible =
            !passwordVisible;

          passwordInput.type =
            passwordVisible
              ? "text"
              : "password";

          eyeIcon.className =
            passwordVisible
              ? "fas fa-eye-slash"
              : "fas fa-eye";

          passwordInput.focus();

        }
      );


      /* =======================================================
         CONFIGURATION DES COMPTES
         
         IMPORTANT :
         Les 4 comptes existants sont conservés.
         
         AJOUT :
         Compte Développement Web
         ======================================================= */

      const users = [

        /* =====================================================
           COMPTE 1 : CRÉATION DIGITALE
           ===================================================== */

        {
          login: "creation",
          password: "2214",
          redirect:
            "https://classroom.google.com/c/ODc0OTU3MzQ4ODA4?cjc=kbvzymu3",
          label: "Création Digitale"
        },


        /* =====================================================
           COMPTE 2 : IA & OUTILS DIGITAUX
           ===================================================== */

        {
          login: "SkilloraAI006",
          password: "JkL28",
          redirect:
            "https://classroom.google.com/c/ODc0OTU3Nzg2NTAx?cjc=r33njxi4",
          label: "IA & Outils Digitaux"
        },


        /* =====================================================
           COMPTE 3 : BUREAUTIQUE
           ===================================================== */

        {
          login: "bureauPro",
          password: "123",
          redirect:
            "bureautique.html",
          label: "Bureautique"
        },


        /* =====================================================
           COMPTE 4 : ADMINISTRATEUR
           ===================================================== */

        {
          login: "admin",
          password: "admin123",
          redirect:
            "admin.html",
          label: "Administration"
        },


        /* =====================================================
           COMPTE 5 : DÉVELOPPEMENT WEB
           
           >>> MODIFIE UNIQUEMENT CES 3 INFORMATIONS <<<
           ===================================================== */

        {
          login: "devWeb",

          password: "DevWeb123",

          redirect:
            "https://classroom.google.com/TON-LIEN-ICI",

          label: "Développement Web"
        }

      ];


      /* =======================================================
         GESTION DE LA CONNEXION
         ======================================================= */

      loginForm.addEventListener(
        "submit",
        function (e) {

          e.preventDefault();


          const login =
            loginInput.value.trim();

          const password =
            passwordInput.value;


          /* ===================================================
             RECHERCHE DU COMPTE
             =================================================== */

          const user =
            users.find(
              u =>
                u.login === login &&
                u.password === password
            );


          /* ===================================================
             CONNEXION RÉUSSIE
             =================================================== */

          if (user) {

            successText.textContent =
              `Bienvenue ${user.label} ! Redirection...`;

            successMsg.classList.add("show");

            errorMsg.classList.remove("show");


            loginButton.disabled = true;

            loginButton.innerHTML =
              '<i class="fas fa-spinner fa-spin mr-2"></i> Redirection...';


            setTimeout(
              function () {

                const targetPage =
                  user.redirect || "index.html";

                window.location.href =
                  targetPage;

              },
              800
            );

          }


          /* ===================================================
             CONNEXION ÉCHOUÉE
             =================================================== */

          else {

            const userExists =
              users.find(
                u =>
                  u.login === login
              );


            if (userExists) {

              errorText.textContent =
                "Mot de passe incorrect.";

            }

            else {

              errorText.textContent =
                "Identifiant inconnu.";

            }


            errorMsg.classList.add("show");

            successMsg.classList.remove("show");


            loginForm.style.animation =
              "shake 0.4s ease-in-out";


            setTimeout(
              () => {

                loginForm.style.animation =
                  "";

              },
              500
            );

          }

        }
      );


      /* =======================================================
         CACHER LES MESSAGES
         ======================================================= */

      function resetMessages() {

        errorMsg.classList.remove("show");

        successMsg.classList.remove("show");

        loginButton.disabled = false;

        loginButton.innerHTML =
          '<i class="fas fa-arrow-right-to-bracket mr-2"></i> Se connecter';

      }


      loginInput.addEventListener(
        "input",
        resetMessages
      );


      passwordInput.addEventListener(
        "input",
        resetMessages
      );


      /* =======================================================
         MESSAGE DE DÉMARRAGE
         ======================================================= */

      console.log(
        "Skillora Login chargé."
      );

    })();

  </script>

</body>
</html>
